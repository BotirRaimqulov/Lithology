[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lithology"
version = "0.1.0"
description = "Well-log lithology and stratigraphic zone prediction pipeline"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["lithology*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
